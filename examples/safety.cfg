# Forbidden zones of the bed and the interlocks (see docs/vector-settings.md). Use it with:
#   phoenix-laser verify PROGRAM.nc --config examples/safety.cfg
# A zone is a rectangle in millimetres of the machine. A program that reaches one fails its check and is not sent.

[machine]
bed_x_mm = 300
bed_y_mm = 200

[zone clamp]
# the laser must be off inside it; the head may cross it, because the clamp is lower than the head
x_mm = 0
y_mm = 0
width_mm = 25
height_mm = 25
kind = no_burn

[zone camera]
# the head must not enter it at all (kind = no_go is what a zone has when the kind is not said)
x_mm = 270
y_mm = 170
width_mm = 30
height_mm = 30
kind = no_go

[interlocks]
# this program reads no sensor: a simulator, a gateway or the person says here what the machine is doing
estop = released
enclosure = closed
air_assist = on
# with these on, nothing is sent or fired unless the enclosure is closed and the air assist is on (a state that is not known counts as unsafe)
require_enclosure = on
require_air_assist = on
