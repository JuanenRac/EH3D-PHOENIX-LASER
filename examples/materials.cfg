# A library of materials: what suits each material and way of working, found with the test grid (phoenix-laser calibrate).
# Try it with:  phoenix-laser materials examples/materials.cfg
#               phoenix-laser cut examples/plate.svg plate.nc --materials examples/materials.cfg --material "birch 3 mm cut"
# These values are only a place to start from for a diode laser: test them on a scrap of the material and write down your own.
# A line that starts with # is a note. Every value is checked when the file is read, and everything is optional: a command takes from
# a material only what it says. The options of the command line win over the material, and the limit of power (max_power_percent, --max-power) holds over both.

[material birch 3 mm cut]
note = two passes with the focus lowered a little at the second
power = 90
speed = 300
passes = 2
focus_step = -0.1
kerf = 0.15

[material birch 3 mm engrave]
note = filled shapes
power = 25
speed = 1500
hatch_spacing = 0.2
hatch_angle = 45

[material birch photo]
note = a picture, dots of 0.1 mm, lifted greys
power = 30
speed = 3000
dot = 0.1
overscan = 2
dither = atkinson
gamma = 1.4
contrast = 10
auto_level = on

[material slate photo]
note = ordered dots; slate needs more power than wood
power = 45
speed = 2000
dot = 0.1
dither = bayer
brightness = 5
invert = off
