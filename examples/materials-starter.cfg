# A starter library for a weak diode laser (5 to 10 W). EVERY entry is marked verified = off: these are only places to start from,
# written as round numbers from general experience and not copied from any table, and nobody has tried them on your machine. Test each on a
# scrap of the material with the grid (phoenix-laser calibrate --material NAME --materials examples/materials-starter.cfg), write down what works for
# you in your own library and mark it verified = on. Each entry also has max_power / max_speed, its own ceiling: a library whose power is over it is refused.
# Use it with:  phoenix-laser materials examples/materials-starter.cfg
#               phoenix-laser cut examples/plate.svg plate.nc --materials examples/materials-starter.cfg --material "plywood 3 mm cut (start)"

[material plywood 3 mm cut (start)]
note = start with many passes at a moderate power and lower the focus a little each pass; air assist on, watch it all the time
verified = off
power = 40
speed = 150
passes = 4
focus_step = -0.2
kerf = 0.2
max_power = 60
max_speed = 600

[material plywood 3 mm engrave (start)]
note = start at a low power and raise it in steps until the colour is the one you want
verified = off
power = 25
speed = 2000
hatch_spacing = 0.1
hatch_angle = 45
max_power = 40
max_speed = 4000

[material plywood photo (start)]
note = start with a picture of dots of 0.1 mm, lifted greys, a run-up at each end of a line
verified = off
power = 30
speed = 3000
dot = 0.1
overscan = 2
dither = atkinson
gamma = 1.2
auto_level = on
max_power = 40
max_speed = 5000

[material cardboard cut (start)]
note = start fast and light; cardboard burns easily, so keep the air assist on and do not leave it
verified = off
power = 30
speed = 600
passes = 1
kerf = 0.15
max_power = 50
max_speed = 1500

[material paper cut (start)]
note = start very light: a thin sheet needs little power, and too much sets it alight
verified = off
power = 10
speed = 1200
passes = 1
max_power = 20
max_speed = 3000

[material leather engrave (start)]
note = start low; leather smokes, so use an extraction fan, and some leathers give off fumes that are bad to breathe
verified = off
power = 15
speed = 2500
hatch_spacing = 0.12
max_power = 30
max_speed = 4000

[material black acrylic engrave (start)]
note = start low on black acrylic only; clear and some coloured acrylic let the beam through or crack
verified = off
power = 20
speed = 1500
hatch_spacing = 0.1
max_power = 35
max_speed = 3000
