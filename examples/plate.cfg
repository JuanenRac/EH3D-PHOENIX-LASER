# Settings for examples/plate.svg and examples/plate.dxf: a plate with a hole and a panel to engrave.
# Try them with:  phoenix-laser cut examples/plate.svg plate.nc --config examples/plate.cfg
# A line that starts with # is a note. Every value is checked when the file is read.

[machine]
# the spindle value that is full power for the controller ($30 of GRBL)
s_max = 1000
# how far the head runs past the end of a hatch line, so that it is at speed when the laser is on
overscan_mm = 2
# the optical power of the laser at full power, in watts; with it `phoenix-laser layers` prints the energy of a pass (0 means it is not known)
laser_watts = 0
# the limit of power, a percent of full power: a layer that asks for more is refused, never lowered
max_power_percent = 100
# the limit of speed in mm/min: a layer or a command that asks for more is refused, never lowered
max_speed_mm_min = 30000
# the machine to use, one of the [profile NAME] sections below (none: the values of this section)
# profile = diode 10 w

[frame]
# the frame of the work (phoenix-laser frame): the speed of the trace, the laps, the margin around the work
feed_mm_min = 3000
laps = 1
margin_mm = 0
# a weak power to see the frame; 0 keeps the laser off, and anything more also needs --confirm-laser-on on the command line
pilot_percent = 0
# the most that pilot_percent may be (a percent of full power); the limit of power of the machine still holds over it
max_pilot_percent = 5

[focus]
# the focus test (phoenix-laser focus): short lines side by side, each burnt at another height
z_start_mm = 0
# 0 means it is not given and the test is refused: which way is down depends on the machine, so say it here or with --z-step
z_step_mm = 0
steps = 9
length_mm = 10
spacing_mm = 2
feed_mm_min = 1000
power_percent = 30

[tone]
# the tone curve of a picture (phoenix-laser engrave --config, and the window): the defaults change nothing
gamma = 1
contrast = 0
brightness = 0
invert = off
auto_level = off

[trace]
# the contours of a picture (phoenix-laser trace): grey levels under the threshold are ink (0 to 255)
threshold = 128
# on: the light parts are ink instead
invert = off
# a point is dropped when the line stays within this distance (mm) without it; 0 keeps them all
simplify_mm = 0.02
# a contour that encloses less than this (mm2) is a speck and is left out
min_area_mm2 = 0.05
# a picture with more pixels is reduced; with more contours or pieces of border it is refused
max_pixels = 4000000
max_contours = 20000
max_segments = 2000000

[verify]
# the check of a program (phoenix-laser verify): how far (mm) the head may go past the bed with the laser off, as the overscan of another program does; 0 allows none, and burning outside the bed always fails
overscan_mm = 0

[calibrate]
# the test grid made from a material (phoenix-laser calibrate --material): how many powers and feeds, and how far they go below and above what the material says (a percent)
steps = 5
spread_percent = 40
# burn the power of each column and the feed of each row next to the squares of a grid made from a material (--no-labels takes them away), with figures this high (mm)
labels = on
label_mm = 3
# the ladder is held at these and never goes under them: the lowest power (a percent of full power) and the lowest feed (mm/min)
min_power_percent = 1
min_feed_mm_min = 10

[text]
# a line of text burnt with the font of strokes (phoenix-laser text): the height of a capital and the tallest one that is accepted (mm)
height_mm = 10
max_height_mm = 100
# the gap between two letters and between two rows, as a percent of the height
spacing_percent = 25
line_spacing_percent = 50
# the power (a percent of full power; the limit of the machine still holds over it) and the speed (mm/min) of the strokes, and how many times the whole text is burnt
power_percent = 20
speed_mm_min = 1000
passes = 1
# the most characters a text may have
max_chars = 200
# on burns the text as its mirror image, for the back of glass or acrylic read from the front
mirror = off

[qr]
# a QR code burnt by filling its dark modules with lines (phoenix-laser qr): the side of a module and the distance between the lines that fill it (mm; the lines are never farther apart than a module)
module_mm = 1
line_mm = 0.1
# the power (a percent of full power; the limit of the machine still holds over it) and the speed (mm/min), and how many times the whole symbol is burnt
power_percent = 20
speed_mm_min = 1000
passes = 1
# the most bytes of data, the largest version (1 to 4), the level of error correction (L, M, Q or H), the largest side (mm) and the most burning moves: more is refused, never cut down
max_bytes = 40
max_version = 4
ecc = M
max_size_mm = 100
max_lines = 100000
# on burns the symbol as its mirror image, for the back of glass or acrylic read from the front
mirror = off
# the run-up at each end of a burnt line (mm, 0 to 20): the head runs up to the line and out past it with the laser off; 0 is none
overscan_mm = 0
# on burns the light modules instead of the dark ones, so the symbol is left bare in a burnt plate
invert = off

[defaults]
# what a layer that is not named below gets
mode = cut
power = 40
speed = 600

# the red lines of the SVG and the layer CUT of the DXF
[layer #ff0000]
mode = cut
power = 90
speed = 300
passes = 2
# the focus moves 0.1 mm down at each pass
focus_step = -0.1
# the beam is 0.15 mm wide: outside the plate and inside the hole, so that both keep their size
kerf = 0.15
kerf_side = auto
# two bridges of 1.5 mm on the outline so that the plate does not fall
tabs = 2
tab_width = 1.5

[layer cut]
mode = cut
power = 90
speed = 300
passes = 2
focus_step = -0.1
kerf = 0.15
kerf_side = auto
tabs = 2
tab_width = 1.5

# the blue panel of the SVG and the layer MARK of the DXF: filled with lines at 45 degrees
[layer #0000ff]
mode = engrave
power = 25
speed = 1500
hatch_angle = 45
hatch_spacing = 0.2

[layer mark]
mode = engrave
power = 25
speed = 1500
hatch_angle = 45
hatch_spacing = 0.2

# a machine profile is a machine and laser: a person with two of them keeps one profile for each and chooses it with  profile = NAME  in [machine] or with --profile NAME.
# What it says wins over [machine]; what it leaves out stays as [machine] says. Take the # off these lines to try it (the power of the layers above must not pass its limits).
# [profile diode 10 w]
# travel_x_mm = 400
# travel_y_mm = 300
# max_power_percent = 100
# max_speed_mm_min = 10000
# s_max = 1000
# laser_watts = 10
