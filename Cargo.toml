[package]
name = "eh3d-phoenix-laser"
version = "0.1.6"
edition = "2021"
rust-version = "1.88"
description = "Laser engraving from an image and cutting from SVG and DXF drawings: dithering, raster G-code with dynamic power and overscan, contours cut by layer with tabs, passes and beam width, and a power-against-feed calibration grid"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-PHOENIX-LASER"
readme = "README.md"

[lib]
name = "eh3d_phoenix_laser"
path = "src/lib.rs"

[[bin]]
name = "phoenix-laser"
path = "src/main.rs"

[features]
default = ["common-machining"]
# the window (egui, with the icon of the program): `cargo run --release --features gui`
gui = ["dep:eframe", "dep:png", "eh3d-view/gui", "eh3d-dock/gui", "eh3d-attachpanel/gui"]
# the starting points of the common database of materials (the family of workpieces of eh3d-materials), on by default; `--no-default-features` leaves them out
common-machining = ["dep:eh3d-materials"]

[dependencies]
# the reader of PGM and PNG pictures, shared with the other programs that work from a picture
eh3d-image = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/image" }
# the one way a number is written in G-code and the standard header of a G-code file, shared with the other programs that write G-code
eh3d-parser-gcode = { version = ">=0.0.7", path = "../EH3D-CORE-LIBS/crates/eh3d-parser-gcode" }
# the one client every program of the suite uses to talk to the EH3D server: login, retries, errors by code in eight languages, a token that is never printed
eh3d-serverclient = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/serverclient" }

# the panel of the settings of the server, the link badge and the login of the window: the model (no window) is always there, the drawing with the feature `gui`
eh3d-view = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/view" }

# the frame of the window: panels that dock, float and fold, workspaces, the menu bar and the shortcuts; the model has no window, the drawing is the feature `gui`
eh3d-dock = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/dock", default-features = false }

# the materials a laser works, with their starting points (verified = false until somebody tries them on a machine), behind the feature `common-machining` (on by default)
eh3d-materials = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/materials", optional = true }

# the `.eh3d` project of the suite, one file with a branch for each program: this program writes only `laser/`
eh3d-project = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/project" }
eh3d-container = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/container" }
serde_json = "1"

# the panel of the attachments of a project, shared by the programs: list, attach, link to a part, extract with a question and the viewer beside
eh3d-attachpanel = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/attachpanel" }

# the window
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"], optional = true }
png = { version = "0.17", optional = true }

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }

[dev-dependencies]
# the tests make their own PNG files
png = "0.17"

[profile.release]
opt-level = 3
lto = true

# the icon and the version information of the Windows executable (build.rs; nothing on other systems)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
