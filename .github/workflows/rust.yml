name: EH3D Rust CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "images/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # The tag of each sibling repository this one is built against (name=tag, separated by spaces); a sibling that is not listed is taken at main.
      SIBLING_REFS: "EH3D-COMMON=v0.3.4 EH3D-CORE-LIBS=v0.0.9"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the sibling repositories (path dependencies) at the tags of SIBLING_REFS
        shell: bash
        env:
          DEST: ../
        run: |
          for dep in EH3D-COMMON EH3D-CORE-LIBS; do
            ref=$(printf '%s\n' ${SIBLING_REFS} | sed -n "s/^${dep}=//p")
            git clone --quiet --depth 1 ${ref:+--branch "$ref"} "https://github.com/${GITHUB_REPOSITORY_OWNER}/${dep}.git" "${DEST}${dep}"
          done
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Libraries of the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Format
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Lints of the window
        run: cargo clippy --all-targets --features gui -- -D warnings
      - name: Lints without the common database of materials
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      # the tests of the window draw it with no screen
      - name: Tests of the window
        run: cargo test --all-targets --features gui
