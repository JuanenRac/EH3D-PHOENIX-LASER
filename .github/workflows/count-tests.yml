name: Count the tests

on:
  push:
    branches: [tmp-count]

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check out the sibling EH3D-COMMON (a path dependency)
        shell: bash
        run: git clone --depth 1 --branch v0.2.1 https://github.com/JuanenRac/EH3D-COMMON.git ../EH3D-COMMON
      - name: Check out the sibling EH3D-CORE-LIBS (a path dependency)
        shell: bash
        run: git clone --depth 1 --branch v0.0.9 https://github.com/JuanenRac/EH3D-CORE-LIBS.git ../EH3D-CORE-LIBS
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Libraries of the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Count the tests of cargo test --workspace
        run: |
          cargo test --workspace 2>&1 | tee /tmp/t.log || true
          awk '/test result: ok/ {s += $4} END {print "TESTCOUNT=" s}' /tmp/t.log
